services:
  mcp:
    build: .
    env_file:
      - .env
    environment:
      # VPSではDifyから接続できるようStreamable HTTPで起動する。
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_PATH: /mcp

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8000"

    networks:
      - proxy
      - affiliate_private

    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

    # PostgreSQLはDocker内部からのみ利用し、VPS外部へ5432を公開しない。
    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - affiliate_private

    restart: unless-stopped

volumes:
  pgdata:

networks:
  # 既存のNginx Proxy Managerが利用しているDockerネットワーク
  proxy:
    external: true

  # Affiliate MCP ServerとPostgreSQL専用の内部ネットワーク
  affiliate_private:
    internal: true